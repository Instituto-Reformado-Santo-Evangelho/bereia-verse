name: Build Linux App

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Inject Google Client Secrets
      env:
        GOOGLE_SECRETS: ${{ secrets.GOOGLE_CLIENT_SECRETS }}
      run: |
        echo "$GOOGLE_SECRETS" > composeApp/src/jvmMain/resources/client_secrets.json

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot binutils

    - name: Build Linux DEB and Distributable
      run: ./gradlew :composeApp:packageDeb :composeApp:createDistributable --no-configuration-cache

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: verse-linux-deb
        path: composeApp/build/compose/binaries/main/deb/*.deb
