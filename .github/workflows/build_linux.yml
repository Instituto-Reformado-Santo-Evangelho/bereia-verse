name: Build Linux App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, Tag ou SHA do bereia-verse para compilar'
        required: false
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout Ref (Tag or Master)
      shell: bash
      run: |
        REF="${{ github.event.inputs.ref || github.ref_name }}"
        echo "Checking out $REF..."
        git checkout $REF || git checkout master

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot binutils

    - name: Create temporary client_secrets.json
      env:
        GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
      run: |
        if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
          echo "Creating client_secrets.json from secret..."
          mkdir -p app/composeApp/src/commonMain/resources
          echo "$GOOGLE_CLIENT_SECRETS_JSON" > app/composeApp/src/commonMain/resources/client_secrets.json
        else
          echo "Secret not found. Skipping client_secrets.json creation."
        fi

    - name: Build Linux DEB and Generic
      run: ./app/gradlew -p ./app :composeApp:createDistributable :composeApp:packageDeb --no-configuration-cache

    - name: Package Generic Linux Artifact (.tar.gz)
      run: |
        DIST_DIR="$GITHUB_WORKSPACE/app/composeApp/build/compose/binaries/main/app"
        OUT_DIR="$GITHUB_WORKSPACE/app/composeApp/build/compose/binaries"
        echo "Empacotando de $DIST_DIR para $OUT_DIR"
        mkdir -p "$OUT_DIR"
        cd "$DIST_DIR" && tar -czvf "$OUT_DIR/bereiaverse-linux-${{ github.ref_name }}.tar.gz" .

    - name: Remove temporary client_secrets.json
      if: always()
      run: |
        if [ -f "app/composeApp/src/commonMain/resources/client_secrets.json" ]; then
          rm app/composeApp/src/commonMain/resources/client_secrets.json
        fi

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          app/composeApp/build/compose/binaries/main/deb/*.deb
          app/composeApp/build/compose/binaries/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
