name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, Tag ou SHA do bereia-verse para compilar'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout Ref (Tag or Master)
      shell: bash
      run: |
        REF="${{ github.event.inputs.ref || github.ref_name }}"
        echo "Checking out $REF..."
        git checkout $REF || git checkout master

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode PFX Certificate
      if: ${{ env.MSIX_PFX_BASE64 != '' }}
      run: |
        $bytes = [System.Convert]::FromBase64String($env:MSIX_PFX_BASE64)
        [IO.File]::WriteAllBytes("app/composeApp/signing.pfx", $bytes)
      shell: powershell

    - name: Create temporary client_secrets.json
      env:
        GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
      run: |
        if ($env:GOOGLE_CLIENT_SECRETS_JSON) {
          echo "Creating client_secrets.json from secret..."
          New-Item -ItemType Directory -Force -Path "app/composeApp/src/commonMain/resources"
          $env:GOOGLE_CLIENT_SECRETS_JSON | Out-File -FilePath "app/composeApp/src/commonMain/resources/client_secrets.json" -Encoding ascii
        } else {
          echo "Secret not found. Skipping client_secrets.json creation."
        }
      shell: powershell

    - name: Build Windows MSIX
      env:
        PFX_PASS: ${{ secrets.MSIX_PFX_PASSWORD }}
      run: |
        ./app/gradlew.bat -p ./app createMsix "-Pmsix.pfx.path=app/composeApp/signing.pfx" "-Pmsix.pfx.password=$env:PFX_PASS" --no-configuration-cache
      shell: bash

    - name: Remove temporary client_secrets.json
      if: always() && steps.create_secrets.conclusion == 'success'
      run: Remove-Item -Path "app/composeApp/src/commonMain/resources/client_secrets.json" -Force
      shell: powershell


    - name: Release
      uses: softprops/action-gh-release@v1
      if: github.ref_type == 'tag'
      with:
        files: app/composeApp/build/outputs/msix/BereiaVerse.msix
