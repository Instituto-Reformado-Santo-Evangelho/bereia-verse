name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, Tag ou SHA do bereia-verse para compilar'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout Ref (Tag or Master)
      shell: bash
      run: |
        REF="${{ github.event.inputs.ref || github.ref_name }}"
        echo "Checking out $REF..."
        git checkout $REF || git checkout master

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode PFX Certificate
      if: ${{ env.MSIX_PFX_BASE64 != '' }}
      run: |
        $bytes = [System.Convert]::FromBase64String($env:MSIX_PFX_BASE64)
        [IO.File]::WriteAllBytes("app/composeApp/signing.pfx", $bytes)
      shell: powershell

    - name: Create temporary client_secrets.json
      id: create_secrets
      env:
        GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
      run: |
        if ($env:GOOGLE_CLIENT_SECRETS_JSON) {
          echo "Creating client_secrets.json from secret..."
          New-Item -ItemType Directory -Force -Path "app/composeApp/src/commonMain/resources"
          $env:GOOGLE_CLIENT_SECRETS_JSON | Out-File -FilePath "app/composeApp/src/commonMain/resources/client_secrets.json" -Encoding ascii
        } else {
          echo "Secret not found. Skipping client_secrets.json creation."
        }
      shell: powershell

    - name: Build Windows MSIX
      env:
        PFX_PASS: ${{ secrets.MSIX_PFX_PASSWORD }}
      run: |
        ./app/gradlew.bat -p ./app :composeApp:createMsix "-Pmsix.pfx.path=app/composeApp/signing.pfx" "-Pmsix.pfx.password=$env:PFX_PASS" --no-configuration-cache
      shell: bash

    - name: Get Version
      id: get_version
      run: |
        $VERSION = (Get-Content app/composeApp/build.gradle.kts | Select-String 'packageVersion = "(.*)"').Matches.Groups[1].Value
        echo "APP_VERSION=$VERSION" >> $env:GITHUB_ENV
      shell: powershell

    - name: Remove temporary client_secrets.json
      if: always()
      run: |
        if (Test-Path "app/composeApp/src/commonMain/resources/client_secrets.json") {
          Remove-Item -Path "app/composeApp/src/commonMain/resources/client_secrets.json" -Force
        }
        if (Test-Path "app/composeApp/signing.pfx") {
          Remove-Item -Path "app/composeApp/signing.pfx" -Force
        }
      shell: powershell


    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
        files: app/composeApp/build/outputs/msix/BereiaVerse.msix
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
