name: Build Windows App

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Inject Google Client Secrets
      env:
        GOOGLE_SECRETS: ${{ secrets.GOOGLE_CLIENT_SECRETS }}
      run: |
        echo "$env:GOOGLE_SECRETS" > composeApp/src/jvmMain/resources/client_secrets.json
      shell: powershell

    - name: Build Windows MSI
      run: ./gradlew :composeApp:packageMsi --no-configuration-cache

    # Opcional: Se quiser um .exe simples além do MSI, o Compose também suporta packageExe 
    # se configurado no build.gradle.kts (TargetFormat.Exe)
    
    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: verse-windows-msi
        path: composeApp/build/compose/binaries/main/msi/*.msi
