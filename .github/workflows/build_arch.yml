name: Build Arch Linux App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, Tag ou SHA do bereia-verse para compilar'
        required: false
        default: ''

jobs:
  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Ref (Tag or Master)
        shell: bash
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          echo "Checking out $REF..."
          git checkout $REF || git checkout master

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create temporary client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            echo "Creating client_secrets.json from secret..."
            mkdir -p app/composeApp/src/commonMain/resources
            echo "$GOOGLE_CLIENT_SECRETS_JSON" > app/composeApp/src/commonMain/resources/client_secrets.json
          else
            echo "Secret not found. Skipping client_secrets.json creation."
          fi

      - name: Build Application Binaries
        run: ./app/gradlew -p ./app createDistributable --no-configuration-cache

      - name: Remove temporary client_secrets.json
        if: always() && steps.create_secrets.conclusion == 'success'
        run: rm app/composeApp/src/commonMain/resources/client_secrets.json


      - name: Checkout Release Repo (PKGBUILD)
        uses: actions/checkout@v4
        with:
          repository: Instituto-Reformado-Santo-Evangelho/bereia-verse-pkgbuild
          path: release_repo

      - name: Prepare Arch Build
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          if [[ -z "$VERSION" ]] || [[ "$VERSION" == "main" ]] || [[ "$VERSION" == "master" ]]; then
            VERSION="0.0.0"
          fi
          echo "Preparing Arch build for version: $VERSION"
          mkdir -p build_arch/src/app
          
          # Copiar PKGBUILD e .desktop do repo de release
          cp release_repo/arch/PKGBUILD build_arch/
          cp release_repo/arch/bereiaverse.desktop build_arch/src/
          
          # Atualizar versão no PKGBUILD
          sed -i "s/pkgver=0.0.0/pkgver=$VERSION/" build_arch/PKGBUILD
          
          # Copiar Binários do App
          cp -r app/composeApp/build/compose/binaries/main/app/bereiaverse/* build_arch/src/app/
          
          # Ícone
          cp app/composeApp/src/desktopMain/resources/bereiaverse.png build_arch/src/bereiaverse.png

      - name: Build Arch Package (Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/build_arch:/package \
            archlinux:latest \
            /bin/bash -c "
              pacman -Syu --noconfirm --needed base-devel && \
              useradd -m builder && \
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers && \
              chown -R builder:builder /package && \
              su builder -c 'cd /package && yes 1 | makepkg -s --noconfirm'
            "

      - name: Release Arch
        uses: softprops/action-gh-release@v1
        if: github.ref_type == 'tag'
        with:
          files: build_arch/*.pkg.tar.zst
