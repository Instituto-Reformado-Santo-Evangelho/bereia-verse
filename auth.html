<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação | Bereia Versículos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
        }
        h1 {
            color: #FFB300; /* Primary Amber */
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        p {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .code-box {
            background: #f8f9fa;
            border: 2px dashed #FFB300;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            word-break: break-all;
            margin-bottom: 1.5rem;
            position: relative;
            cursor: pointer;
        }
        .btn {
            background-color: #FFB300;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        .btn:hover {
            background-color: #FFA000;
        }
        .btn-secondary {
            background-color: #eee;
            color: #555;
        }
        .btn-secondary:hover {
            background-color: #ddd;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #aaa;
        }
        .success-badge {
            display: none;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://tech.santoevangelho.com.br/logo.png" alt="Bereia Logo" class="logo" onerror="this.src='https://raw.githubusercontent.com/JetBrains/compose-multiplatform/master/tutorials/HTML_Resources/logo.png'">
    <h1>Autorização Concluída</h1>
    <p id="instruction">Copie o código abaixo e cole no campo de login do aplicativo Bereia Versículos.</p>
    
    <div id="success" class="success-badge">✓ Código Copiado!</div>
    
    <div class="code-box" id="code-display" onclick="copyCode()">
        Carregando código...
    </div>

    <button class="btn" onclick="copyCode()">Copiar Código</button>
    <button class="btn btn-secondary" onclick="tryOpenApp()">Voltar para o App</button>

    <div class="footer">
        © 2026 Instituto Reformado Santo Evangelho - IRSE
    </div>
</div>

<script>
    // 1. Extrai o código da URL
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    const codeDisplay = document.getElementById('code-display');

    if (authCode) {
        codeDisplay.innerText = authCode;
    } else {
        codeDisplay.innerText = "Código não encontrado na URL.";
        codeDisplay.style.borderColor = "#f44336";
        document.getElementById('instruction').innerText = "Houve um erro ao obter o código do Google.";
    }

    // 2. Função de Copiar
    function copyCode() {
        if (!authCode) return;
        
        navigator.clipboard.writeText(authCode).then(() => {
            const badge = document.getElementById('success');
            badge.style.display = 'block';
            setTimeout(() => { badge.style.display = 'none'; }, 3000);
        });
    }

    // 3. Tenta abrir o app via protocolo customizado (se registrado)
    function tryOpenApp() {
        if (authCode) {
            window.location.href = `bereia-verse://auth?code=${authCode}`;
        }
    }

    // Tenta abrir automaticamente após 2 segundos
    if (authCode) {
        setTimeout(tryOpenApp, 2000);
    }
</script>

</body>
</html>
