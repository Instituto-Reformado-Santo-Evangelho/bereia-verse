name: bereiaverse
title: Bereia Versículos
version: '1.3.0'
summary: Seu Assistente Bíblico Inteligente.
description: |
  Copie uma referência, veja o versículo na hora. Leve, rápido e com notas integradas para seus estudos.
  Chega de alternar entre abas ou abrir programas pesados para consultar versículos. O Bereia Versículos traz a Bíblia até você: basta copiar a referência e o texto aparece de forma rápida e elegante.
  Seja preparando um sermão, estudando para a escola dominical ou pesquisando para trabalhos acadêmicos, o Bereia oferece acesso imediato às Escrituras, além de um sistema de notas integrado para registrar cada revelação ou insight.

website: https://irse.com.br
contact: https://github.com/Instituto-Reformado-Santo-Evangelho/bereia-verse/issues
source-code: https://github.com/Instituto-Reformado-Santo-Evangelho/bereia-verse

grade: stable
confinement: strict
base: core24
compression: xz

# O ícone principal do snap (arquivo local usado durante o build)
icon: ../../app/composeApp/src/desktopMain/resources/bereiaverse.png

platforms:
  amd64:

apps:
  bereiaverse:
    command: bin/bereiaverse
    extensions: [gnome]
    desktop: usr/share/applications/br.com.irse.verse.desktop
    plugs:
      - x11
      - wayland
      - opengl
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - gsettings
    environment:
      JAVA_TOOL_OPTIONS: "-Dorg.jetbrains.skiko.renderApi=OPENGL -Dskiko.linux.display.server=Wayland -Djava.awt.headless=false"

parts:
  bereia-verse:
    plugin: nil
    source: ../..
    build-packages:
      - openjdk-21-jdk
      - libasound2-dev
      - libpng-dev
      - libgl1-mesa-dev
      - libx11-dev
      - zlib1g-dev
    stage-packages:
      - libasound2t64
      - libgl1
      - wl-clipboard
      - xclip
    override-build: |
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      export PATH=$JAVA_HOME/bin:$PATH
      
      cd app
      ./gradlew :composeApp:createReleaseDistributable --no-daemon
      
      # O caminho da distribuição de release
      DIST_PATH="composeApp/build/compose/binaries/main-release/app/bereiaverse"
      
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/lib
      
      # Copia a distribuição otimizada (JRE + App)
      cp -r $DIST_PATH/bin/* $SNAPCRAFT_PART_INSTALL/bin/
      cp -r $DIST_PATH/lib/* $SNAPCRAFT_PART_INSTALL/lib/
      
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/bereiaverse

      # Ícone
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps
      cp composeApp/src/desktopMain/resources/bereiaverse.png $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/bereiaverse.png
      
      # Desktop file
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      cp linux/aur/bereiaverse-bin/br.com.irse.verse.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/
    prime:
      - bin
      - lib
      - usr/share/icons
      - usr/share/applications
      - -usr/lib/jvm # Remove redundant JDK files if any leaked into install
